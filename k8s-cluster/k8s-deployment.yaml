apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-platform-ui
  namespace: apps
  labels:
    app: k8s-platform-ui
    version: "1.0"
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: k8s-platform-ui
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: k8s-platform-ui
    spec:
      # Pull from DockerHub (public image — no secret needed)
      # If private repo, add imagePullSecrets below
      # imagePullSecrets:
      #   - name: dockerhub-secret
      containers:
        - name: k8s-platform-ui
          image: raja713/k8s-platform-ui:a999f12
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 1000
      restartPolicy: Always