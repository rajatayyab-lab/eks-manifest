apiVersion: v1
kind: Service
metadata:
  name: k8s-platform-ui
  namespace: apps
  labels:
    app: k8s-platform-ui
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  type: ClusterIP          # MetalLB + Traefik ingress handles external access
  selector:
    app: k8s-platform-ui
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8080